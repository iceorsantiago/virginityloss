# loq-dots · Noctalia v5 with the suzuha look (MystiaFin's shell built with amane):
#  - Catppuccin Mocha with blue accent #89b4fa ("Amane" palette in palettes/Amane.json)
#  - Poppins as the UI font
#  - 40 px bar stuck to the top, full width, whose bottom corners curve
#    inward and blend into the screen corners (suzuha's "liquid" effect)
#  - Widgets as rounded pills; launcher and panels come out attached to the bar
# Everything can also be tweaked from the Settings window (Super+N).

[shell]
lang                = "en"
font_family         = "Poppins"
corner_radius_scale = 1.0
time_format         = "{:%I:%M %p}"
polkit_agent        = true
telemetry_enabled   = false

[shell.panel]
transparency_mode        = "soft"
shadow                   = true
launcher_placement       = "attached"
control_center_placement = "attached"
wallpaper_placement      = "attached"
session_placement        = "attached"
clipboard_placement      = "floating"

[theme]
mode           = "dark"
source         = "custom"
custom_palette = "Amane"
# For colors taken from the wallpaper (suzuha's "dynamic" mode):
# source = "wallpaper"

[wallpaper]
enabled             = true
fill_mode           = "crop"
transition          = ["disc"]
transition_duration = 1200
directory           = "@WALLPAPERS@"

[wallpaper.default]
path = "@WALLPAPER@"

# Lock screen: its own image instead of the blurred, tinted desktop wallpaper.
# The image is the user's own file (not in the repo); without it Noctalia falls back to the wallpaper.
[lockscreen]
# 16:9 crop shifted left so the subject isn't clipped by the centered crop:
#   ffmpeg -i miles-morales.jpeg -vf crop=3840:2160:300:0 -q:v 2 miles-morales-lock.jpg
wallpaper      = "@WALLPAPERS@/miles-morales-lock.jpg"
blur_intensity = 0.1
tint_intensity = 0.15

[backdrop]
enabled = false

[bar.main]
position             = "top"
thickness            = 40
background_opacity   = 1.0
compositor_blur      = false
shadow               = false
contact_shadow       = false
margin_ends          = 0
margin_edge          = 0
radius               = 16
radius_bottom_left   = 16
radius_bottom_right  = 16
concave_edge_corners = true
padding              = 12
widget_spacing       = 8
capsule              = true
capsule_fill         = "surface_container"
start  = ["launcher", "workspaces"]
center = ["clock", "gwb", "media"]
end    = ["tray", "cpu", "cpu-temp", "ram", "vram", "gpu-temp", "volume", "network", "bluetooth", "brightness", "battery", "notifications", "control-center"]

# Samsung S19A300B over VGA (HDMI->VGA adapter "PNP(RGT)"): the analog picture is shifted and
# cuts off the top edge. A thin margin keeps the bar inside the visible area.
[bar.main.monitor.samsung]
match       = "PNP(RGT)"
margin_edge = 8

[widget.cpu]
type          = "sysmon"
stat          = "cpu_usage"
visualization = "none"

# Always-visible metrics next to CPU usage (GPU values come from the NVIDIA driver via NVML)
[widget.cpu-temp]
type          = "sysmon"
stat          = "cpu_temp"
visualization = "none"

[widget.ram]
type          = "sysmon"
stat          = "ram_used"
visualization = "none"

[widget.vram]
type          = "sysmon"
stat          = "gpu_vram"
visualization = "none"

[widget.gpu-temp]
type          = "sysmon"
stat          = "gpu_temp"
visualization = "none"

# Guess Who's Back in the bar: the running timer, or the class that is on now / next (community plugin
# tordex/stdout in JSON mode). The app writes the file every 30 s and hides it on quit; a file older than
# 2 minutes (the app crashed or is closed) hides the widget too. Click: open the app.
[widget.gwb]
type           = "tordex/stdout:bar"
cmd            = "f=\"$HOME/.local/state/guess-whos-back/bar.json\"; [ -n \"$(find \"$f\" -mmin -2 2>/dev/null)\" ] && cat \"$f\" || echo '{\"visible\":false}'"
interval       = 15
interval_units = "1"
json           = true

[widget.gwb.actions]
left = "exec guess-whos-back"

# The widget needs the community plugin; enable it once (it is fetched from Noctalia's community source):
#   noctalia msg plugins enable tordex/stdout

# Desktop widgets on the laptop screen (they sit under windows: see them on an empty workspace).
# Move them with the editor: Super+N -> Desktop -> Toggle Editor, or  noctalia msg desktop-widgets-toggle-edit
[desktop_widgets]
enabled = true

[desktop_widgets.widget.clock]
type   = "clock"
output = "eDP-1"
cx     = 960.0
cy     = 270.0
box_width  = 0.0
box_height = 0.0

[desktop_widgets.widget.clock.settings]
clock_style = "digital"
format      = "{:%I:%M %p}"
shadow      = true

[desktop_widgets.widget.media]
type   = "media_player"
output = "eDP-1"
cx     = 960.0
cy     = 560.0
box_width  = 0.0
box_height = 0.0

[desktop_widgets.widget.media.settings]
hide_when_no_media   = false
album_art_background = true
shadow               = true

[desktop_widgets.widget.cpu]
type   = "sysmon"
output = "eDP-1"
cx     = 700.0
cy     = 860.0
box_width  = 0.0
box_height = 0.0

[desktop_widgets.widget.cpu.settings]
display    = "graph"
stat       = "cpu_usage"
stat2      = "cpu_temp"
show_label = true

[desktop_widgets.widget.gpu]
type   = "sysmon"
output = "eDP-1"
cx     = 1220.0
cy     = 860.0
box_width  = 0.0
box_height = 0.0

[desktop_widgets.widget.gpu.settings]
display    = "graph"
stat       = "gpu_usage"
stat2      = "gpu_vram"
show_label = true

# Weather location (Noctalia supports one; the Conky panel also shows Quito)
[location]
auto_locate = false
address     = "Urcuquí, Imbabura, Ecuador"

[desktop_widgets.widget.weather]
type   = "weather"
output = "eDP-1"
cx     = 300.0
cy     = 270.0
box_width  = 0.0
box_height = 0.0

[desktop_widgets.widget.weather.settings]
show_forecast = true
forecast_days = 3
shadow        = true
