# Never idle-suspend Bluetooth speakers. When a stream stops for a few seconds WirePlumber
# suspends the output, and some speakers (the Echo Dot) drop the whole link when that happens.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
