# The laptop only SENDS audio over Bluetooth (to speakers/headphones); it never acts as a speaker.
# The Echo Dot offers both A2DP roles. With the laptop's A2DP-sink role on, BlueZ also tries the
# reverse stream ("Echo plays into the laptop"); the Echo refuses it (busy / permission denied)
# and sometimes the card even came up as audio-gateway instead of a2dp-sink.
#   a2dp_source        -> laptop plays music to speakers (the only A2DP role we want)
#   hfp_ag / hsp_ag    -> laptop is the "phone" side, so a headset's microphone still works
#                         (hfp_hf/hsp_hs were the wrong way round: they make the laptop a headset)
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source hfp_ag hsp_ag ]
}
