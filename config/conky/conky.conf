-- RAM + VRAM panel on the desktop (Conky on Wayland). Catppuccin Mocha colors.
-- Started by niri at login (spawn-at-startup). Reload: just save this file.
conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    alignment = 'top_right',
    gap_x = 28,
    gap_y = 64,
    minimum_width = 330,
    maximum_width = 330,
    own_window = true,
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 200,
    own_window_colour = '1e1e2e',
    border_inner_margin = 16,
    draw_borders = false,
    draw_shades = false,
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=10',
    default_color = 'cdd6f4',
    color1 = '89b4fa',
    color2 = 'a6adc8',
    color3 = '6c7086',
    default_bar_width = 330,
    default_bar_height = 6,
    update_interval = 2,
    cpu_avg_samples = 2,
    no_buffers = true,
    top_name_width = 22,
    double_buffer = true,
}

conky.text = [[
${font JetBrainsMono Nerd Font:bold:size=12}${color1}  MEMORY${font}
${color2}Used${alignr}${color}$mem / $memmax  ($memperc%)
${color1}${membar 6}
${color2}Available${alignr}${color}$memeasyfree
${color2}Cache + buffers${alignr}${color}${cached} + ${buffers}
${color2}Swap${alignr}${color}$swap / $swapmax  ($swapperc%)
${color1}${swapbar 6}
${color3}Top RAM users
${color}${top_mem name 1}${alignr}${top_mem mem_res 1}
${color}${top_mem name 2}${alignr}${top_mem mem_res 2}
${color}${top_mem name 3}${alignr}${top_mem mem_res 3}
${color}${top_mem name 4}${alignr}${top_mem mem_res 4}

${font JetBrainsMono Nerd Font:bold:size=12}${color1}󰢮  GPU${font}
${execpi 3 ~/.config/conky/gpu.sh}

${font JetBrainsMono Nerd Font:bold:size=12}${color1}  WEATHER${font}
${execpi 1800 ~/.config/conky/weather.sh}
]]
