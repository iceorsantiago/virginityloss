# loq-dots: suspend/resume fix for the LOQ 15ARP9 (RTX 4050, no iGPU), 2026-11-10.
#
# S0ix power management OFF. With it on, s2idle parks the GPU in GC6 (video memory in
# self-refresh) and this machine fails to bring it back:
#   NVRM: s_executeBooterUcode_TU102: Booter failed with non-zero error code: 0x89
#   NVRM: gpuPowerManagementResume: GSP boot failed at resume (bootMode 0x2): 0xffff
#   NVRM: _gpuGc6ExitStateLoad: GPU is unable to transition from GC6 to D0 state.
# The GPU drives the only screen, so the result is a black screen with a live kernel.
# With S0ix off the driver uses the regular path: nvidia-suspend.service copies VRAM to
# /var/tmp (PreserveVideoMemoryAllocations=1) and the GPU does a full GSP boot on resume.
# Cost: somewhat higher battery drain while asleep and a slower suspend/resume (VRAM copy).
#
# The file name starts with "zz-" on purpose: /etc/modprobe.d/nvidia.conf (package-owned)
# sets EnableS0ixPowerManagement=1, files are read in name order and the last value wins.
# Takes effect after: sudo update-initramfs -u -k all && reboot
# Undo: sudo bash tools/rollback-suspend-fix.sh
options nvidia NVreg_EnableS0ixPowerManagement=0
