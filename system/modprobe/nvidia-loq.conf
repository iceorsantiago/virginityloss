# loq-dots: RTX 4050 sin GPU integrada, Wayland (niri).
# KMS y framebuffer del driver: obligatorios para Wayland y para tener consola en la pantalla.
options nvidia-drm modeset=1 fbdev=1
# Guardar la VRAM al suspender (lo usan los servicios nvidia-suspend/resume).
# Debian 13 monta /tmp en RAM, así que el volcado va a /var/tmp.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
