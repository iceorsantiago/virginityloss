# loq-dots: RTX 4050 with no integrated GPU, Wayland (niri).
# Driver KMS and framebuffer: required for Wayland and for having a console on the screen.
options nvidia-drm modeset=1 fbdev=1
# Saving VRAM on suspend (PreserveVideoMemoryAllocations, dumped to /var/tmp) is already set by
# /etc/modprobe.d/nvidia.conf from the nvidia-kernel-support package; not repeated here.
# Runtime D3 off: no fine-grained GPU power gating (it drives the only screen).
# S0ix is turned OFF in zz-nvidia-loq-suspend.conf (it has to sort after nvidia.conf): the
# 2026-11-05 attempt turned it on, and that GC6 path is what fails on resume (docs/suspend-resume.md).
options nvidia NVreg_DynamicPowerManagement=0x00
