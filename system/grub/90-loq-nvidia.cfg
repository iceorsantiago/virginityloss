# loq-dots: NVIDIA KMS from boot (also set in /etc/modprobe.d/nvidia-loq.conf).
# Suspend fix for the LOQ 15ARP9 (2026-11-05): without these, closing the lid left a black screen
# that never woke up (kernel alive, only the power button recovered it). It worked with ALL of them
# together; the minimal set was not isolated. Notes: ~/suspend-resume-analysis.md
#   pcie_aspm=off                              no PCIe link power states
#   nvme_core.default_ps_max_latency_us=0      no NVMe deep power states
# To undo: delete this file and run  sudo update-grub
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT nvidia-drm.modeset=1 nvidia-drm.fbdev=1 pcie_aspm=off nvme_core.default_ps_max_latency_us=0"
