# loq-dots: dual boot with Windows.
# Debian 13 ships with os-prober off; without this, every update-grub drops Windows from the menu.
GRUB_DISABLE_OS_PROBER=false
# Debian is the first entry and boots by itself after 5 seconds
GRUB_DEFAULT=0
GRUB_TIMEOUT=5
# To undo: delete this file and run  sudo update-grub
