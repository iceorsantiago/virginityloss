# loq-dots: dual boot con Windows.
# Debian 13 trae os-prober apagado; sin esto, cada update-grub quita a Windows del menú.
GRUB_DISABLE_OS_PROBER=false
# Debian es la primera opción y arranca sola a los 5 segundos
GRUB_DEFAULT=0
GRUB_TIMEOUT=5
# Para deshacer: borra este archivo y corre  sudo update-grub
